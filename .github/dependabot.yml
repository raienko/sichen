# Dependency updates, opened as pull requests on a weekly schedule.
#
# Paused for now: `open-pull-requests-limit: 0` keeps version updates from
# opening anything (security alerts still appear under the Security tab).
# Raise the limits to turn them on.
version: 2
updates:
  # The actions the workflows use, all in one weekly pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # npm packages, grouped weekly. Expo SDK packages are left out on purpose:
  # their versions are set by the SDK, so they move only with
  # `npx expo install --fix` (Code quality / Expo Doctor flags when they drift).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    versioning-strategy: increase
    ignore:
      - dependency-name: expo
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: jest-expo
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
      production:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

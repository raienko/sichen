<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b2216;
        overflow: hidden;
        font-family: Georgia, serif;
      }
      canvas {
        display: block;
      }
      .vig {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 48%,
          transparent 52%,
          rgba(10, 14, 8, 0.55) 100%
        );
      }
      .hud {
        position: fixed;
        color: #f4ead2;
        font: 600 12px system-ui;
      }
      .port {
        left: 14px;
        top: 14px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 2px solid #d9c08a;
        background: radial-gradient(circle at 50% 40%, #c99b76, #5a3a28);
      }
      .lvl {
        left: 52px;
        top: 52px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #15130f;
        border: 1.5px solid #d9c08a;
        text-align: center;
        line-height: 20px;
      }
      .bar {
        left: 76px;
        height: 7px;
        border-radius: 4px;
      }
      .mm {
        right: 14px;
        top: 14px;
        width: 96px;
        height: 72px;
        border: 1.5px solid #d9c08a;
        border-radius: 8px;
        background: rgba(20, 22, 18, 0.75);
      }
      .mml {
        right: 14px;
        top: 92px;
        width: 96px;
        text-align: center;
        font-size: 12px;
      }
      .stick {
        left: 22px;
        bottom: 26px;
        width: 118px;
        height: 118px;
        border-radius: 50%;
        border: 2px solid rgba(244, 234, 210, 0.8);
        background: rgba(20, 20, 20, 0.15);
      }
      .knob {
        left: 58px;
        bottom: 62px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        background: rgba(244, 234, 210, 0.8);
      }
      .btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 2px solid #f4ead2;
        background: rgba(15, 15, 12, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .eye {
        right: 20px;
        bottom: 96px;
        width: 58px;
        height: 58px;
        border-width: 2.5px;
      }
      .tag {
        right: 16px;
        top: 330px;
        padding: 5px 10px;
        border-radius: 6px;
        background: rgba(15, 15, 12, 0.8);
        border: 1px solid #6b5a3a;
      }
      .lv {
        padding: 2px 6px;
        border-radius: 4px;
        background: rgba(15, 15, 12, 0.85);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="vig"></div>
    <div class="hud port"></div>
    <div class="hud lvl">5</div>
    <div
      class="hud bar"
      style="top: 20px; width: 120px; background: #c8322e"
    ></div>
    <div
      class="hud bar"
      style="top: 32px; width: 120px; background: #3a6fd0"
    ></div>
    <div
      class="hud bar"
      style="top: 44px; width: 104px; background: #cfa63a"
    ></div>
    <div class="hud mm"></div>
    <div class="hud mml">Vyshhorod</div>
    <div class="hud stick"></div>
    <div class="hud knob"></div>
    <div class="hud btn eye">👁</div>
    <div class="hud btn" style="right: 84px; bottom: 66px">📖</div>
    <div class="hud btn" style="right: 132px; bottom: 30px">👤</div>
    <div class="hud btn" style="right: 182px; bottom: 24px">🎒</div>
    <div class="hud btn" style="right: 22px; bottom: 30px">📜</div>
    <div class="hud tag">// Vovkulaka 5 · 4</div>
    <div id="labels"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.184.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      const W = innerWidth,
        H = innerHeight;
      const r = new THREE.WebGLRenderer({ antialias: true });
      r.setPixelRatio(devicePixelRatio);
      r.setSize(W, H);
      r.shadowMap.enabled = true;
      r.shadowMap.type = THREE.PCFShadowMap;
      r.outputColorSpace = THREE.SRGBColorSpace;
      r.toneMapping = THREE.ACESFilmicToneMapping;
      r.toneMappingExposure = 1.05;
      document.body.appendChild(r.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1f2a1a);
      scene.fog = new THREE.Fog(0x24301e, 60, 100);
      const cam = new THREE.PerspectiveCamera(32, W / H, 1, 200);
      cam.position.set(0, 50, 42);
      cam.lookAt(0, 0, -1);

      // Seeded random so the shot is reproducible.
      let s = 7;
      const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
      const lam = (c, o = {}) =>
        new THREE.MeshLambertMaterial({ color: c, flatShading: true, ...o });
      function add(geo, mat, x, y, z, sx = 1, sy = 1, sz = 1, ry = 0) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.scale.set(sx, sy, sz);
        m.rotation.y = ry;
        m.castShadow = m.receiveShadow = true;
        scene.add(m);
        return m;
      }

      // Lights: warm low sun + cool sky fill, the whole "golden hour" look.
      scene.add(new THREE.HemisphereLight(0xbcd2ff, 0x3a3020, 1.1));
      const sun = new THREE.DirectionalLight(0xffd9a0, 2.6);
      sun.position.set(-18, 30, 8);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, {
        left: -30,
        right: 30,
        top: 30,
        bottom: -30,
      });
      scene.add(sun);

      // Path polyline: main N-S trail plus a fork toward the wolves and shrine.
      const path = [
        [
          [0, -30],
          [0, 30],
        ],
        [
          [0, -2],
          [8, -10],
        ],
        [
          [0, -4],
          [-7, -8],
        ],
      ];
      function pathDist(x, z) {
        let d = 1e9;
        for (const [[ax, az], [bx, bz]] of path) {
          const vx = bx - ax,
            vz = bz - az,
            t = Math.max(
              0,
              Math.min(
                1,
                ((x - ax) * vx + (z - az) * vz) / (vx * vx + vz * vz),
              ),
            );
          d = Math.min(d, Math.hypot(x - ax - t * vx, z - az - t * vz));
        }
        return d;
      }
      const river = (x) => 9 + Math.sin(x * 0.25) * 1.2;

      // Ground: one low-poly plane, colour per face from path / grass noise.
      const g = new THREE.PlaneGeometry(70, 80, 46, 52).toNonIndexed();
      g.rotateX(-Math.PI / 2);
      const p = g.attributes.position,
        col = [];
      for (let i = 0; i < p.count; i++) p.setY(i, (rnd() - 0.5) * 0.18);
      const grass = [0x6c7a3c, 0x697739, 0x6f7d3e, 0x667438],
        dirt = [0xa58457, 0x9c7c50, 0xae8c5d];
      for (let i = 0; i < p.count; i += 3) {
        const cx = (p.getX(i) + p.getX(i + 1) + p.getX(i + 2)) / 3,
          cz = (p.getZ(i) + p.getZ(i + 1) + p.getZ(i + 2)) / 3;
        const d = pathDist(cx, cz) + (rnd() - 0.5) * 0.9;
        const c = new THREE.Color(
          d < 1.25 ? dirt[(rnd() * 3) | 0] : grass[(rnd() * 4) | 0],
        );
        if (Math.abs(cz - river(cx)) < 2.2) c.set(0x3f6f8a);
        for (let k = 0; k < 3; k++) col.push(c.r, c.g, c.b);
      }
      g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
      g.computeVertexNormals();
      const ground = new THREE.Mesh(
        g,
        new THREE.MeshLambertMaterial({
          vertexColors: true,
          flatShading: true,
        }),
      );
      ground.receiveShadow = true;
      scene.add(ground);
      // Water surface
      const wg = new THREE.PlaneGeometry(70, 3.6, 40, 1);
      wg.rotateX(-Math.PI / 2);
      const wp = wg.attributes.position;
      for (let i = 0; i < wp.count; i++)
        wp.setZ(i, wp.getZ(i) + river(wp.getX(i)));
      add(
        wg,
        new THREE.MeshLambertMaterial({
          color: 0x4f8db0,
          transparent: true,
          opacity: 0.75,
        }),
        0,
        0.12,
        0,
      ).castShadow = false;

      // Faceted rock: jittered icosahedron.
      function rockGeo() {
        const geo = new THREE.IcosahedronGeometry(1, 0);
        const a = geo.attributes.position;
        for (let i = 0; i < a.count; i++)
          a.setXYZ(
            i,
            a.getX(i) * (0.8 + rnd() * 0.4),
            a.getY(i) * (0.7 + rnd() * 0.3),
            a.getZ(i) * (0.8 + rnd() * 0.4),
          );
        geo.computeVertexNormals();
        return geo;
      }
      const rockGeos = Array.from({ length: 6 }, rockGeo),
        rockMat = lam(0x6e6a78);
      const rock = (x, z, k) =>
        add(
          rockGeos[(rnd() * 6) | 0],
          rockMat,
          x,
          k * 0.35,
          z,
          k,
          k * 0.85,
          k,
          rnd() * 6,
        );

      // Pine: three stacked 7-sided cones.
      const cone = new THREE.ConeGeometry(1, 1, 7),
        trunk = new THREE.CylinderGeometry(0.18, 0.25, 1, 6);
      const pines = [0x2f5a35, 0x3b6b3c, 0x2a4f31],
        autumn = [0xd29a2a, 0xc8762a, 0xb5352a];
      function pine(x, z, k, fall) {
        const c = lam(fall ? autumn[(rnd() * 3) | 0] : pines[(rnd() * 3) | 0]);
        add(trunk, lam(0x5a3f2a), x, 0.5 * k, z, k, k, k);
        for (let t = 0; t < 3; t++)
          add(
            cone,
            c,
            x,
            (1.3 + t * 1.05) * k,
            z,
            (1.6 - t * 0.38) * k,
            1.6 * k,
            (1.6 - t * 0.38) * k,
            rnd() * 3,
          );
      }
      // Forest border, leaving clearings and the path open.
      for (let i = 0; i < 520; i++) {
        const x = (rnd() - 0.5) * 60,
          z = (rnd() - 0.5) * 70;
        const d = pathDist(x, z),
          inClear =
            Math.hypot(x - 7, z + 7) < 6 ||
            Math.hypot(x + 7, z + 9) < 5 ||
            Math.hypot(x, z + 2) < 5;
        if (d < 3.2 || inClear || Math.abs(z - river(x)) < 3) continue;
        if (Math.abs(x) < 12 && z > -16 && z < 6 && rnd() < 0.7) continue;
        rnd() < 0.3
          ? rock(x, z, 0.7 + rnd() * 1.4)
          : pine(x, z, 0.9 + rnd() * 0.6, rnd() < 0.12);
      }
      for (let i = 0; i < 18; i++) {
        const x = (rnd() - 0.5) * 22,
          z = (rnd() - 0.5) * 30;
        if (pathDist(x, z) > 2.5) rock(x, z, 0.25 + rnd() * 0.35);
      }
      // Grass tufts and meadow flowers, instanced so they cost one draw call each.
      const tuft = new THREE.ConeGeometry(0.12, 0.7, 3),
        flower = new THREE.IcosahedronGeometry(0.12, 0);
      function scatter(geo, color, n, y, test) {
        const im = new THREE.InstancedMesh(geo, lam(color), n),
          m = new THREE.Matrix4();
        let k = 0;
        for (let i = 0; i < n * 6 && k < n; i++) {
          const x = (rnd() - 0.5) * 40,
            z = (rnd() - 0.5) * 50;
          if (!test(x, z)) continue;
          m.makeRotationY(rnd() * 6).setPosition(x, y, z);
          im.setMatrixAt(k++, m);
        }
        im.count = k;
        scene.add(im);
      }
      const meadow = (x, z) =>
        pathDist(x, z) > 1.8 && Math.abs(z - river(x)) > 2.4;
      scatter(tuft, 0x8a9a45, 500, 0.3, meadow);
      scatter(tuft, 0x55702e, 300, 0.3, meadow);
      scatter(flower, 0xf2ead6, 160, 0.12, meadow);
      scatter(flower, 0xe0b040, 90, 0.12, meadow);
      scatter(flower, 0xc0302a, 70, 0.12, meadow);
      scatter(
        new THREE.CylinderGeometry(0.05, 0.05, 1.1, 4),
        0x6a7a3a,
        120,
        0.5,
        (x, z) => Math.abs(Math.abs(z - river(x)) - 2.1) < 0.4,
      );
      // Stepping stones across the ford
      for (let i = 0; i < 5; i++)
        add(
          new THREE.CylinderGeometry(0.7, 0.8, 0.3, 6),
          lam(0x8a8794),
          (rnd() - 0.5) * 1.2,
          0.18,
          river(0) - 1.6 + i * 0.8,
          1,
          1,
          1,
          rnd(),
        );

      // Candle with a real point light (the warm pools of the concept).
      const candle = (x, y, z, light) => {
        add(
          new THREE.CylinderGeometry(0.07, 0.07, 0.35, 6),
          lam(0xf0e6c8),
          x,
          y + 0.17,
          z,
        );
        add(
          new THREE.SphereGeometry(0.08, 6, 4),
          new THREE.MeshBasicMaterial({ color: 0xffc860 }),
          x,
          y + 0.42,
          z,
        ).castShadow = false;
        if (light) {
          const l = new THREE.PointLight(0xffa040, 18, 7, 1.6);
          l.position.set(x, y + 0.8, z);
          scene.add(l);
        }
      };
      // Shrine: plinth, post, pitched roof, red rushnyk.
      const sx = -7,
        sz = -9,
        wood = lam(0x6b4a30);
      add(new THREE.BoxGeometry(3, 0.5, 2.4), lam(0x8a8794), sx, 0.25, sz);
      add(new THREE.BoxGeometry(1.4, 2.2, 1), wood, sx, 1.6, sz);
      const roof = add(
        new THREE.ConeGeometry(1.4, 1, 4),
        lam(0x4d4f5a),
        sx,
        3.1,
        sz,
        1.2,
        0.9,
        0.9,
        Math.PI / 4,
      );
      add(new THREE.BoxGeometry(0.15, 0.9, 0.15), wood, sx, 4, sz);
      add(new THREE.BoxGeometry(0.55, 0.12, 0.12), wood, sx, 4.1, sz);
      add(
        new THREE.PlaneGeometry(0.9, 1.1),
        lam(0xb8302a, { side: THREE.DoubleSide }),
        sx,
        1.4,
        sz + 0.52,
      );
      add(new THREE.PlaneGeometry(0.6, 0.6), lam(0xf2ead6), sx, 1.5, sz + 0.53);
      [
        [-1, 0.9],
        [1.1, 0.8],
        [-0.6, 1.1],
        [0.7, 1.15],
      ].forEach(([dx, dz], i) => candle(sx + dx, 0.5, sz + dz, i === 0));
      for (let i = 0; i < 14; i++)
        add(
          new THREE.IcosahedronGeometry(0.16, 0),
          lam(rnd() < 0.6 ? 0xc0302a : 0xe8c060),
          sx + (rnd() - 0.5) * 4.5,
          0.15,
          sz + 1.3 + rnd() * 1.4,
        );
      // Gate posts with red ribbons and candles.
      for (const [gx, gz] of [
        [-2.2, -19],
        [2.2, -19],
        [-2.2, 21],
        [2.2, 21],
      ]) {
        add(new THREE.BoxGeometry(0.6, 3, 0.6), wood, gx, 1.5, gz);
        add(new THREE.BoxGeometry(0.66, 0.3, 0.66), lam(0xb8302a), gx, 2.2, gz);
        candle(gx, 3, gz, gz < 0);
      }
      // Fences
      for (let i = 0; i < 6; i++)
        add(
          new THREE.BoxGeometry(0.15, 0.25, 1.9),
          wood,
          -10.5 + i * 0.05,
          0.75,
          -4 + i * 1.8,
        );

      // Primitive Cossack: white shirt, oxblood sharovary, black chupryna, sabre.
      const hero = new THREE.Group();
      hero.position.set(0, 0, 4.5);
      hero.rotation.y = Math.PI * 0.85;
      hero.scale.setScalar(1.6);
      scene.add(hero);
      const part = (geo, c, x, y, z, sx, sy, sz, rz = 0) => {
        const m = new THREE.Mesh(geo, lam(c));
        m.position.set(x, y, z);
        m.scale.set(sx, sy, sz);
        m.rotation.z = rz;
        m.castShadow = true;
        hero.add(m);
      };
      const cyl = new THREE.CylinderGeometry(0.5, 0.5, 1, 8),
        sph = new THREE.IcosahedronGeometry(0.5, 1),
        box = new THREE.BoxGeometry(1, 1, 1);
      part(box, 0x2a201a, -0.22, 0.2, 0, 0.26, 0.4, 0.34);
      part(box, 0x2a201a, 0.22, 0.2, 0, 0.26, 0.4, 0.34);
      part(cyl, 0xa8282a, -0.22, 0.75, 0, 0.42, 0.8, 0.42);
      part(cyl, 0xa8282a, 0.22, 0.75, 0, 0.42, 0.8, 0.42);
      part(cyl, 0x8a1f22, 0, 1.2, 0, 0.82, 0.18, 0.6);
      part(cyl, 0xf3eee2, 0, 1.6, 0, 0.78, 0.75, 0.55);
      part(cyl, 0xf3eee2, -0.5, 1.5, 0, 0.22, 0.7, 0.22, 0.25);
      part(cyl, 0xf3eee2, 0.5, 1.5, 0, 0.22, 0.7, 0.22, -0.4);
      part(sph, 0xd8a684, 0, 2.2, 0, 0.5, 0.55, 0.5);
      part(box, 0x1a1410, 0, 2.5, -0.05, 0.12, 0.12, 0.4);
      part(box, 0xd8dde4, 0.95, 1.55, 0.1, 0.06, 1.2, 0.08, -1.0);
      // Wolves: faceted body, cone muzzle, glowing eyes, ground ring + projected labels.
      function wolf(x, z, ry, lv) {
        const w = new THREE.Group();
        w.position.set(x, 0, z);
        w.rotation.y = ry;
        w.scale.setScalar(1.4);
        scene.add(w);
        const fur = lam(0x4a4a52),
          wp = (geo, m, px, py, pz, a, b, c, rx = 0) => {
            const q = new THREE.Mesh(geo, m);
            q.position.set(px, py, pz);
            q.scale.set(a, b, c);
            q.rotation.x = rx;
            q.castShadow = true;
            w.add(q);
          };
        wp(
          new THREE.IcosahedronGeometry(0.5, 0),
          fur,
          0,
          0.9,
          0,
          1.0,
          0.8,
          1.9,
        );
        wp(
          new THREE.IcosahedronGeometry(0.5, 0),
          fur,
          0,
          1.15,
          0.75,
          0.75,
          0.7,
          0.7,
        );
        wp(
          new THREE.ConeGeometry(0.22, 0.6, 5),
          fur,
          0,
          1.05,
          1.25,
          1,
          1,
          1,
          Math.PI / 2,
        );
        wp(
          new THREE.ConeGeometry(0.12, 0.3, 4),
          fur,
          -0.18,
          1.55,
          0.7,
          1,
          1,
          1,
        );
        wp(new THREE.ConeGeometry(0.12, 0.3, 4), fur, 0.18, 1.55, 0.7, 1, 1, 1);
        for (const [lx, lz] of [
          [-0.25, 0.5],
          [0.25, 0.5],
          [-0.25, -0.55],
          [0.25, -0.55],
        ])
          wp(
            new THREE.CylinderGeometry(0.08, 0.06, 0.6, 5),
            fur,
            lx,
            0.3,
            lz,
            1,
            1,
            1,
          );
        wp(
          new THREE.ConeGeometry(0.15, 0.8, 5),
          fur,
          0,
          0.9,
          -1.1,
          1,
          1,
          1,
          -2.2,
        );
        const eye = new THREE.MeshBasicMaterial({ color: 0xff3020 });
        wp(
          new THREE.SphereGeometry(0.06, 6, 4),
          eye,
          -0.15,
          1.25,
          1.05,
          1,
          1,
          1,
        );
        wp(
          new THREE.SphereGeometry(0.06, 6, 4),
          eye,
          0.15,
          1.25,
          1.05,
          1,
          1,
          1,
        );
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(1.75, 1.95, 40),
          new THREE.MeshBasicMaterial({ color: 0xffa040 }),
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(x, 0.12, z);
        scene.add(ring);
        const glow = new THREE.Mesh(
          new THREE.CircleGeometry(1.8, 40),
          new THREE.MeshBasicMaterial({
            color: 0xff8a30,
            transparent: true,
            opacity: 0.12,
          }),
        );
        glow.rotation.x = -Math.PI / 2;
        glow.position.set(x, 0.11, z);
        scene.add(glow);
        return [new THREE.Vector3(x, 3.2, z), lv];
      }
      const tags = [wolf(6, -9, -0.6, 5), wolf(10.5, -6.5, -0.9, 4)];
      r.render(scene, cam);
      // HTML labels projected from 3D, like world.tsx does today.
      for (const [v, lv] of tags) {
        v.project(cam);
        const d = document.createElement("div");
        d.className = "hud lv";
        d.innerHTML =
          lv +
          ' <span style="display:inline-block;width:28px;height:4px;background:#d03a30;vertical-align:middle"></span>';
        d.style.left = ((v.x + 1) / 2) * W - 22 + "px";
        d.style.top = ((1 - v.y) / 2) * H - 10 + "px";
        document.getElementById("labels").appendChild(d);
      }
      document.title = "ready";
    </script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <radialGradient id="forest"><stop stop-color="#20303a"/><stop offset=".65" stop-color="#111b20"/><stop offset="1" stop-color="#090e11"/></radialGradient>
    <linearGradient id="oak" x2="0" y2="1"><stop stop-color="#493125"/><stop offset=".4" stop-color="#2b211c"/><stop offset="1" stop-color="#171717"/></linearGradient>
    <linearGradient id="thread" x2="0" y2="1"><stop stop-color="#2a2221"/><stop offset="1" stop-color="#111718"/></linearGradient>
    <pattern id="woodgrain" width="40" height="24" patternUnits="userSpaceOnUse"><path d="M2 6h20M12 19h23" stroke="#b37f58" stroke-width="1" stroke-opacity=".1"/></pattern>

    <text x="30" y="415" class="tag">PRIMARY BUTTON</text>
    <path d="M84 434h268l15 28-15 28H84l-15-28z" fill="url(#thread)" stroke="#c17b59" stroke-width="2"/><path d="M90 440h256v44H90z" fill="url(#weave)" opacity=".52"/>
    <text x="177" y="471" class="sample">Continue</text><use href="#chevron" x="324" y="445" width="34" height="34" class="ivory"/>
    <text x="30" y="537" class="tag">CLASS / ITEM</text>
    <use href="#diamond" x="43" y="548" width="70" height="70" class="ember"/><use href="#shield" x="57" y="562" width="42" height="42" class="ivory"/>

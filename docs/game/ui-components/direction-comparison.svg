    <symbol id="person" viewBox="0 0 48 48"><circle cx="24" cy="15" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 43c1-11 6-17 14-17s13 6 14 17" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <style>
      .title{font:600 46px Georgia,serif;fill:#eddfc7;letter-spacing:1px}.lead{font:18px Arial,sans-serif;fill:#9ca7a6}.head{font:600 28px Georgia,serif;fill:#e8d9bb}.sub{font:15px Arial,sans-serif;fill:#9aa19b;letter-spacing:.4px}.tag{font:600 12px Arial,sans-serif;letter-spacing:2px;fill:#a69782}.sample{font:24px Georgia,serif;fill:#eee0c8}.num{font:20px Georgia,serif;fill:#eee0c8}.ivory{color:#edddc4}.bronze{color:#b69a70}.ember{color:#dda26b}.dim{color:#756f67}.line{stroke:#665744;stroke-width="1"}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#forest)"/>
  <path d="M0 0h170L80 540 0 720Zm1600 0h-160l84 580 76 130Z" fill="#080d10" opacity=".55"/>
  <text x="60" y="78" class="title">Three directions for the same UI</text>
  <text x="62" y="113" class="lead">A shared layout and interaction model; only the material, edge, and ornament change.</text>
  <path d="M60 136h1480" stroke="#6c604d"/>

  <!-- A: Carved oak -->

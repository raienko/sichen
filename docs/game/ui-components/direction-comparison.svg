    <symbol id="diamond" viewBox="0 0 48 48"><path d="M24 2 46 24 24 46 2 24Z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="chevron" viewBox="0 0 34 34"><path d="m11 5 12 12-12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="eye" viewBox="0 0 48 48"><path d="M4 24Q24 5 44 24 24 43 4 24Z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="24" cy="24" r="6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="24" cy="24" r="2" fill="currentColor"/></symbol>
    <symbol id="hub" viewBox="0 0 48 48"><path d="m24 2 9 9-9 9-9-9zM11 15l9 9-9 9-9-9zM37 15l9 9-9 9-9-9zM24 28l9 9-9 9-9-9z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="shield" viewBox="0 0 48 48"><path d="M24 4 41 10v14c0 10-7 17-17 21C14 41 7 34 7 24V10Z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M24 11v28M12 22h24" stroke="currentColor" stroke-width="1.6"/></symbol>

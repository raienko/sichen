  <rect width="1600" height="1240" fill="url(#night)"/>
  <path d="M0 0h200L58 790 0 1045Zm1600 0h-190l130 795 60 250Z" fill="#080d0f" opacity=".65"/>
  <text x="75" y="78" class="title">A motif language for Sichen</text>
  <text x="77" y="112" class="lead">Geometric embroidery becomes a small grammar for states, paths, and touch points.</text>
  <path d="M76 137h1448" stroke="#665742"/>

  <text x="78" y="177" class="mini">SOURCE GEOMETRY → FIVE ORIGINAL UI MARKS</text>
  <g transform="translate(105 205)"><use href="#rhombus" width="90" height="90" class="bone"/><text x="-6" y="116" class="label">nested rhombus</text></g>
  <g transform="translate(385 205)"><use href="#stepCross" width="90" height="90" class="red"/><text x="8" y="116" class="label">stepped cross</text></g>
  <g transform="translate(668 205)"><use href="#rosette" width="90" height="90" class="bronze"/><text x="7" y="116" class="label">eightfold flower</text></g>
  <g transform="translate(955 205)"><use href="#chain" width="90" height="90" class="green"/><text x="4" y="116" class="label">diamond chain</text></g>
  <g transform="translate(1240 205)"><use href="#chevrons" width="90" height="90" class="bone"/><text x="9" y="116" class="label">path chevrons</text></g>
  <path d="M76 358h1448" stroke="#665742"/>

  <text x="78" y="400" class="mini">APPLIED TO EXISTING CONTROLS</text>
  <!-- Input and action: physical relics only at deliberate touch points -->
  <text x="83" y="443" class="head">Name &amp; action</text><text x="84" y="468" class="label">Carved wood carries the few controls that ask for a decision.</text>
  <g transform="translate(95 500)">
    <path d="M18 0h450l18 29-18 29H18L0 29Z" fill="url(#oak)" stroke="#a87c58" stroke-width="2"/><path d="M24 7h438l11 22-11 22H24L13 29Z" fill="url(#grain)" stroke="#694c37"/>
    <use href="#rhombus" x="36" y="12" width="34" height="34" class="red"/><use href="#rhombus" x="415" y="12" width="34" height="34" class="red"/>
    <text x="190" y="41" class="head" font-size="27">Остап</text><text x="506" y="40" class="value">⚄</text>
  </g>
  <g transform="translate(215 608)">
    <path d="M16 0h216l16 27-16 27H16L0 27Z" fill="url(#oak)" stroke="#c39061" stroke-width="2"/>
    <path d="m31 27 7-7 7 7-7 7m162 0 7-7 7 7-7 7" fill="none" stroke="#ae6150" stroke-width="1.5"/>
    <path d="m58 27 5-5 5 5 5-5 5 5m115 0 5-5 5 5 5-5 5 5" fill="none" stroke="#9d8357"/>
    <use href="#chev" x="106" y="9" width="36" height="36" class="bone"/>
  </g>
  <text x="96" y="710" class="mini">ONE INPUT SURFACE · ONE ACTION RELIC</text>

  <!-- Status and minimap: ornaments as connectors -->
  <text x="754" y="443" class="head">Status &amp; map</text><text x="756" y="468" class="label">Diamond knots connect the avatar to three quiet resource lines.</text>

  <text x="758" y="710" class="mini">RESOURCE METER · IDOL MINIMAP</text>
  <path d="M76 749h1448" stroke="#665742"/>

  <!-- Open inventory geometry: no panel box -->
  <text x="78" y="792" class="mini">LAYOUT INSPIRATION / INVENTORY OPENED ON DEMAND</text>
  <text x="80" y="826" class="head">The hero stays central. Equipment gathers around them.</text>
  <g transform="translate(470 846)">
    <circle cx="330" cy="27" r="16" fill="none" stroke="#cdbb9c" stroke-width="2"/><path d="M300 69c5-21 18-29 30-29s25 8 30 29l-8 91h-44Z" fill="#382d28" stroke="#cdbb9c" stroke-width="2"/><path d="M312 159l-8 57m44-57 8 57" stroke="#cdbb9c" stroke-width="3"/>

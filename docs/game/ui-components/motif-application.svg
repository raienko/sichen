    <style>
      .title{font:600 44px Georgia,serif;fill:#eee0c8;letter-spacing:1px}.lead{font:18px Arial,sans-serif;fill:#a7a9a3}.head{font:600 26px Georgia,serif;fill:#eadbc3}.label{font:15px Arial,sans-serif;fill:#a7a498;letter-spacing:.3px}.mini{font:12px Arial,sans-serif;fill:#8e9089;letter-spacing:2px}.value{font:23px Georgia,serif;fill:#e7d8bc}.bone{color:#e9d9bf}.bronze{color:#b59870}.amber{color:#d7a06d}.red{color:#a8584a}.green{color:#6c7861}.dim{color:#68716e}

    <style>
      .title{font:600 30px Georgia,serif;fill:#eee1c9}.lead{font:16px Arial,sans-serif;fill:#a4a49b}.mini{font:12px Arial,sans-serif;fill:#92958e;letter-spacing:2px}.value{font:23px Georgia,serif;fill:#ecddc4}.button{font:26px Georgia,serif;fill:#ecddc4}.ivory{color:#eaddc5}.bronze{color:#b5966c}.amber{color:#d9a06c}.dim{color:#64706e}.red{color:#a9544a}.blue{color:#93d6db}
